name: Publish

on:
  release:
    # `published` also fires when a draft is promoted; `created` would miss that and
    # run before the tag exists.
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-SNAPSHOT)'
        required: false
        type: string

# The job only reads the repo; credentials come from secrets.
permissions:
  contents: read

# Never let two publishes race for the same coordinates.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-maven-central:
    runs-on: ubuntu-latest
    # Uses environment secrets. Configure protection rules separately in GitHub;
    # declaring an environment here does not restrict refs or require approval.
    environment: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Resolve the version once. Release events carry a tag; manual runs may pass
      # `version`. If neither resolves, Gradle uses its default SNAPSHOT version.
      - name: Determine version
        id: version
        env:
          # Pass untrusted values via env, not `${{ }}` interpolation, so a tag with
          # shell metacharacters cannot inject into the script.
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/v}" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Catch non-v-prefixed release tags, which the check above misses.
          if [ -z "$VERSION" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "Resolved version: $VERSION"
          else
            echo "No version resolved; publishing the project's default SNAPSHOT version."
          fi

      # Fail fast with a named secret instead of an opaque 401 or an unsigned release.
      - name: Verify credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::error::MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD secrets must both be set."
            exit 1
          fi
          case "$VERSION" in
            "" | *-SNAPSHOT)
              # Default or snapshot version: no signing required.
              ;;
            *)
              if [ -z "$SIGNING_KEY" ]; then
                echo "::error::SIGNING_IN_MEMORY_KEY must be set to publish a release; Central rejects unsigned releases."
                exit 1
              fi
              ;;
          esac

      # A wrong passphrase fails later as an opaque BouncyCastle "checksum mismatch".
      # Verify it here, and strip CR / trailing newline that copy-paste or
      # `echo ... | gh secret set` can introduce into the key or password.
      - name: Verify signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            "" | *-SNAPSHOT)
              echo "Snapshot publication; skipping signing key verification."
              exit 0
              ;;
          esac
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_IN_MEMORY_KEY must be set to publish a release."
            exit 1
          fi
          KEY=$(printf '%s' "$SIGNING_KEY" | tr -d '\r')
          PASS=$(printf '%s' "$SIGNING_PASSWORD" | tr -d '\r\n')
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$KEY" | gpg --batch --import >/dev/null 2>&1
          if ! printf 'verify' | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$PASS" --sign -o /dev/null - >/dev/null 2>&1; then
            echo "::error::SIGNING_IN_MEMORY_KEY or SIGNING_IN_MEMORY_KEY_PASSWORD is invalid (bad passphrase or corrupted key)."
            exit 1
          fi
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<__SIGNING_KEY__"
            printf '%s\n' "$KEY"
            echo "__SIGNING_KEY__"
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$PASS"
          } >> "$GITHUB_ENV"

      # Published artifacts are immutable, so verify before uploading.
      - name: Check
        run: ./gradlew check --no-configuration-cache

      - name: Publish to Maven Central
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -n "$VERSION" ]; then
            ./gradlew publishToMavenCentral -PprojectDoctorVersion="$VERSION" --no-configuration-cache
          else
            ./gradlew publishToMavenCentral --no-configuration-cache
          fi

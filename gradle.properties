org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Artifactory publishing: ARTIFACTORY_URL, ARTIFACTORY_USERNAME, ARTIFACTORY_PASSWORD
# Defaults to libs-snapshot-local / libs-release-local on artifactory.bandlab.cloud
#
# Maven Central (Central Portal), via com.vanniktech.maven.publish:
#   ORG_GRADLE_PROJECT_mavenCentralUsername / ORG_GRADLE_PROJECT_mavenCentralPassword
#   ORG_GRADLE_PROJECT_signingInMemoryKey / ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
# Both are opt-in: absent credentials simply skip the Central repo and signing.

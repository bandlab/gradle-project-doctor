org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Maven Central (Sonatype Central Portal) publishing.
# Credentials are plain Gradle properties, so use these names:
#   mavenCentralUsername / mavenCentralPassword
#   signingInMemoryKey / signingInMemoryKeyPassword
#
# Locally: put them in ~/.gradle/gradle.properties (never commit secrets).
# CI: use ORG_GRADLE_PROJECT_mavenCentralUsername etc., which Gradle maps to the
# same properties (see .github/workflows/publish.yml).
#
# Signing is optional in config. Snapshots publish unsigned; releases need a key.
